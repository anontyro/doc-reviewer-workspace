[package]
name = "llm-review-workspace"
version = "0.0.0"
description = "Local-first review workspace for LLM-generated documents"
edition = "2021"
default-run = "llm-review-workspace"

[lib]
name = "llm_review_workspace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
comrak = { version = "0.59.0", default-features = false }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
